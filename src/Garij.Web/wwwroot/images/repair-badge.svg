<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200" fill="none">
  <!-- Winged Badge Emblem -->
  <defs>
    <filter id="badge-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#00a8ff" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Arched Top Text: REPAIR SERVICE -->
  <path id="curveTop" d="M 80 80 Q 200 20 320 80" fill="transparent"/>
  <text font-family="'Montserrat', sans-serif" font-weight="800" font-size="16" fill="#f8fafc" letter-spacing="5" text-anchor="middle">
    <textPath href="#curveTop" startOffset="50%" text-anchor="middle">
      REPAIR SERVICE
    </textPath>
  </text>

  <!-- Left Wing -->
  <g stroke="#cbd5e1" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M165 95 C140 75, 90 70, 50 85 C80 95, 120 100, 160 105" />
    <path d="M160 105 C130 90, 85 92, 60 105 C90 112, 130 114, 160 115" />
    <path d="M155 115 C130 108, 95 112, 75 125 C105 126, 135 124, 155 123" />
    <path d="M150 125 C130 122, 105 128, 90 140 C115 138, 135 133, 150 131" />
  </g>

  <!-- Right Wing -->
  <g stroke="#cbd5e1" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M235 95 C260 75, 310 70, 350 85 C320 95, 280 100, 240 105" />
    <path d="M240 105 C270 90, 315 92, 340 105 C310 112, 270 114, 240 115" />
    <path d="M245 115 C270 108, 305 112, 325 125 C295 126, 265 124, 245 123" />
    <path d="M250 125 C270 122, 295 128, 310 140 C285 138, 265 133, 250 131" />
  </g>

  <!-- Crossed Spark Plugs -->
  <!-- Spark Plug 1 (top-left to bottom-right) -->
  <g transform="translate(200, 110) rotate(-35) translate(-200, -110)" stroke="#f1f5f9" stroke-width="1.6" fill="#0f172a">
    <!-- Terminal -->
    <rect x="196" y="55" width="8" height="8" rx="2" fill="#00a8ff" stroke="#38bdf8"/>
    <!-- Insulator ribs -->
    <rect x="195" y="65" width="10" height="4" rx="1" fill="#f8fafc"/>
    <rect x="194" y="71" width="12" height="4" rx="1" fill="#f8fafc"/>
    <rect x="195" y="77" width="10" height="4" rx="1" fill="#f8fafc"/>
    <!-- Hex nut -->
    <path d="M192 84 L208 84 L206 96 L194 96 Z" fill="#94a3b8" stroke="#cbd5e1"/>
    <!-- Threaded body -->
    <rect x="195" y="98" width="10" height="28" fill="#475569" stroke="#cbd5e1"/>
    <line x1="195" y1="104" x2="205" y2="104" stroke="#94a3b8"/>
    <line x1="195" y1="110" x2="205" y2="110" stroke="#94a3b8"/>
    <line x1="195" y1="116" x2="205" y2="116" stroke="#94a3b8"/>
    <line x1="195" y1="122" x2="205" y2="122" stroke="#94a3b8"/>
    <!-- Ground electrode -->
    <path d="M198 128 L198 135 L202 135" stroke="#38bdf8" stroke-width="2" fill="none"/>
  </g>

  <!-- Spark Plug 2 (top-right to bottom-left) -->
  <g transform="translate(200, 110) rotate(35) translate(-200, -110)" stroke="#f1f5f9" stroke-width="1.6" fill="#0f172a">
    <!-- Terminal -->
    <rect x="196" y="55" width="8" height="8" rx="2" fill="#00a8ff" stroke="#38bdf8"/>
    <!-- Insulator ribs -->
    <rect x="195" y="65" width="10" height="4" rx="1" fill="#f8fafc"/>
    <rect x="194" y="71" width="12" height="4" rx="1" fill="#f8fafc"/>
    <rect x="195" y="77" width="10" height="4" rx="1" fill="#f8fafc"/>
    <!-- Hex nut -->
    <path d="M192 84 L208 84 L206 96 L194 96 Z" fill="#94a3b8" stroke="#cbd5e1"/>
    <!-- Threaded body -->
    <rect x="195" y="98" width="10" height="28" fill="#475569" stroke="#cbd5e1"/>
    <line x1="195" y1="104" x2="205" y2="104" stroke="#94a3b8"/>
    <line x1="195" y1="110" x2="205" y2="110" stroke="#94a3b8"/>
    <line x1="195" y1="116" x2="205" y2="116" stroke="#94a3b8"/>
    <line x1="195" y1="122" x2="205" y2="122" stroke="#94a3b8"/>
    <!-- Ground electrode -->
    <path d="M198 128 L198 135 L202 135" stroke="#38bdf8" stroke-width="2" fill="none"/>
  </g>

  <!-- Center Shield/Banner Ribbon -->
  <path d="M 175 125 Q 200 135 225 125 L 220 148 Q 200 156 180 148 Z" fill="#0b1120" stroke="#00a8ff" stroke-width="1.5" />
  <text x="200" y="142" font-family="'Montserrat', sans-serif" font-weight="700" font-size="11" fill="#00d2ff" text-anchor="middle" letter-spacing="2">TUNING</text>
  
  <text x="200" y="172" font-family="'Montserrat', sans-serif" font-weight="600" font-size="11" fill="#94a3b8" text-anchor="middle" letter-spacing="3">1983</text>
  <line x1="165" y1="168" x2="185" y2="168" stroke="#00a8ff" stroke-width="1.5" />
  <line x1="215" y1="168" x2="235" y2="168" stroke="#00a8ff" stroke-width="1.5" />
</svg>
